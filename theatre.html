<style>

body{
background:var(--bg);
color:var(--text);
overflow-x:hidden;
}

/* ================= NAVBAR ================= */

.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:80px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 60px;

    background:rgba(0,0,0,.25);
    backdrop-filter:blur(18px);

    z-index:1000;
    box-sizing:border-box;
}

.nav-logo img{
    height:50px;
    width:auto;
    display:block;
}

.nav-links{
    display:flex;
    gap:40px;
    list-style:none;
    margin:0;
    padding:0;
}

.nav-links a{
    color:var(--text);
    text-decoration:none;
    font-size:17px;
    font-weight:600;
    transition:.3s;
}

.nav-links a:hover{
    opacity:.7;
}
/* Hide scrollbar but keep scrolling */

html, body{
    overflow-y: scroll;
    scrollbar-width: none;      /* Firefox */
    -ms-overflow-style: none;   /* IE/Edge */
}

html::-webkit-scrollbar,
body::-webkit-scrollbar{
    display: none;              /* Chrome, Edge, Safari */
}

header{
    position: relative;   /* <-- ADD THIS */
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 40px;
}

header h1{
font-size:90px;
font-weight:900;
letter-spacing:-5px;
}

header p{
margin-top:20px;
font-size:22px;
opacity:.7;
}

.back{
position:fixed;
left:30px;
top:30px;
text-decoration:none;
color:var(--text);
font-size:18px;
font-weight:600;
z-index:999;
}

section{
padding:100px 8%;
}

.title{

font-size:clamp(32px,5vw,52px);

margin-bottom:60px;

text-align:center;

}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
    align-items:start;
}

.card{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
overflow:hidden;
transition:.4s;
backdrop-filter:blur(20px);
}

body.light .card{
background:#f8f8f8;
border:1px solid #ddd;
}

.card:hover{
transform:translateY(-15px);
}

.card video{
    width:100%;
    aspect-ratio:9/16;   /* Use 16/9 if your video is horizontal */
    object-fit:cover;
    display:block;
    border-radius:20px 20px 0 0;
    background:#000;
}

.video-container{
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;
    border-radius:20px 20px 0 0;
}

.video-container iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
}

.info{
padding:25px;
}

.info h2{
font-size:30px;
margin-bottom:12px;
align-items: center;
text-align: center;
}

.info p{
line-height:1.8;
opacity:.7;
}

.stats{
display:flex;
flex-wrap:wrap;
gap:20px;
margin-top:50px;
}

.stat{
flex:1;
min-width:240px;
padding:30px;
border-radius:18px;
text-align:center;
background:rgba(255,255,255,.05);
}

body.light .stat{
background:#f4f4f4;
}

.stat h3{
font-size:42px;
margin-bottom:10px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:40px;
}

.gallery img{

width:100%;

aspect-ratio:1/1;

height:auto;

object-fit:cover;

border-radius:15px;

transition:.4s;

}

.gallery img:hover{
transform:scale(1.05);
}

footer{
padding:60px;
text-align:center;
opacity:.6;
}

@media (max-width:768px){

    .navbar{
        height:auto;
        padding:15px 20px;
        flex-direction:column;
        gap:15px;
    }

    .nav-logo img{
        height:40px;
    }

    .nav-links{
        gap:20px;
        flex-wrap:wrap;
        justify-content:center;
    }

    .nav-links a{
        font-size:15px;
    }

    header{
        min-height:100vh;
        padding:100px 20px 40px;
    }

    header h1{
        font-size:48px;
        letter-spacing:-2px;
    }

    header p{
        font-size:18px;
    }

    section{
        padding:70px 20px;
    }

    .title{
        font-size:32px;
        text-align:center;
    }

    .awards{
        flex-direction:column;
    }

    .award{
        width:100%;
    }

    .gallery{
        grid-template-columns:repeat(2,1fr);
    }
}
/* Page enters from right */
body{
    animation: revealFromRight .9s cubic-bezier(.77,0,.18,1);
}

@keyframes revealFromRight{

    from{
        transform: translateX(100%);
    }

    to{
        transform: translateX(0);
    }

}

/* Scroll Down Arrow */

.scroll-down{
    position:absolute;
    bottom:35px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    animation:float 1.5s ease-in-out infinite;
}

/* First arrow */
.arrow1{
    color:rgba(255,255,255,.35);
    font-size:22px;
    line-height:12px;
    transform:rotate(90deg);
}

/* Second arrow */
.arrow2{
    color:rgba(255,255,255,.9);
    font-size:34px;
    line-height:18px;
    transform:rotate(90deg);
}

@keyframes float{
    0%,100%{
        transform:translateX(-50%) translateY(0);
    }
    50%{
        transform:translateX(-50%) translateY(10px);
    }
}

.video-wrapper{
    position:relative;
    width:100%;
    aspect-ratio:9/16;      /* Reel style */
    overflow:hidden;
    border-radius:20px 20px 0 0;
    background:#000;
}

.video-wrapper img,
.video-wrapper video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.film-video{
    display:none;
}

.play-btn{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:70px;
    height:70px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    color:#fff;
    font-size:28px;
    cursor:pointer;
    z-index:2;
}

/*==================================================
PRODUCT PHOTOSHOOT
==================================================*/

.photoshoot{
    padding:100px 8%;
}

.photo-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}

.photo-card{
    position:relative;
    overflow:hidden;
    border-radius:20px;
    background:#111;
    cursor:pointer;

    opacity:0;
    transform:translateY(80px) scale(.9);

    transition:
        transform .8s ease,
        opacity .8s ease;
}

.photo-card.show{
    opacity:1;
    transform:translateY(0) scale(1);
}

.photo-card img{
    width:100%;
    height:420px;
    object-fit:cover;
    display:block;

    transition:
        transform .6s ease,
        filter .6s ease;
}

.photo-card:hover img{
    transform:scale(1.08);
    filter:brightness(.85);
}

/* Dark overlay */

.photo-card::after{

    content:"";

    position:absolute;

    inset:0;

    background:linear-gradient(
        to top,
        rgba(0,0,0,.45),
        transparent 60%
    );

    opacity:0;

    transition:.5s;

}

.photo-card:hover::after{
    opacity:1;
}

/* Responsive */

@media(max-width:768px){

    .photo-grid{

        grid-template-columns:1fr;

    }

    .photo-card img{

        height:340px;

    }

}

</style>

<script>
    const videos = document.querySelectorAll(".film-video");

videos.forEach(video => {

    // Only one video plays
    video.addEventListener("play", () => {

        videos.forEach(v => {
            if (v !== video) {
                v.pause();
                v.currentTime = 0;
                v.load(); // Shows poster again
            }
        });

    });

    // When paused, show thumbnail again
    video.addEventListener("pause", () => {

        if (!video.ended) {
            video.currentTime = 0;
            video.load();   // Reloads the poster image
        }

    });

});
</script>
<script src="https://www.youtube.com/iframe_api"></script>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
let players = [];

function onYouTubeIframeAPIReady() {

    document.querySelectorAll(".video-container iframe").forEach((iframe, index) => {

        iframe.id = "ytplayer" + index;

        players.push(new YT.Player(iframe.id, {
            events: {
                onStateChange: onPlayerStateChange
            }
        }));

    });

}

function onPlayerStateChange(event) {

    if (event.data === YT.PlayerState.PLAYING) {

        players.forEach(player => {

            if (player !== event.target) {

                player.pauseVideo();

            }

        });

    }

}

const photoCards = document.querySelectorAll(".photo-card");

const observer = new IntersectionObserver((entries)=>{

    entries.forEach(entry=>{

        if(entry.isIntersecting){

            entry.target.classList.add("show");

        }

    });

},{
    threshold:0.2
});

photoCards.forEach(card=>observer.observe(card));
</script>
